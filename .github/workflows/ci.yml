
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Install dependencies
        run: go mod download

      # pkg/ contains a large unused toolkit; only vet packages reachable from the app.
      - name: Vet
        run: |
          chmod +x scripts/ci-packages.sh
          ./scripts/ci-packages.sh | xargs go vet

      - name: Test
        run: |
          ./scripts/ci-packages.sh | xargs go test -v -race -count=1 -coverprofile=coverage.txt -covermode=atomic
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # Skip unused toolkit packages under pkg/{relay,voice,providers,...}
          args: --timeout 5m ./cmd/... ./internal/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build admin UI (embed)
        run: |
          chmod +x scripts/build-admin.sh
          ./scripts/build-admin.sh

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "none")
          LDFLAGS="-X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT}"
          go build -ldflags "${LDFLAGS}" -o bin/infectious-disease ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: bin/infectious-disease

  # ── 安全扫描 ──
  security:
    name: Security (govulncheck + gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.10'
          cache: true
          # Must use go-package (not package); otherwise action scans ./... and
          # fails on unused toolkit code under pkg/ that is not in go.mod.
          go-package: ./cmd/... ./internal/...

      - name: gosec
        uses: securego/gosec@master
        with:
          # Seed/dev tooling uses math/rand and local paths by design; focus on app code.
          # Exclude noisy rules that are false-positives for controlled CLI/seed helpers.
          args: >-
            -exclude=G104,G301,G306,G404
            -exclude-dir=testdata
            -exclude-dir=pkg
            -exclude-dir=cmd/seed
            -exclude-dir=cmd/visionprep
            -exclude-dir=cmd/import_materials
            ./cmd/... ./internal/...
